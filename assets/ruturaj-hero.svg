<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="rvHeroTitle rvHeroDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rvHeroTitle">Ruturaj Vyavahare - Aspiring VLSI, RTL Design and Design Verification Engineer</title>
  <desc id="rvHeroDesc">Burgundy banner with circuit traces, a technical grid and an RTL waveform, showing the name Ruturaj Vyavahare and the tagline Aspiring VLSI, RTL Design, Design Verification Engineer.</desc>
  <defs>
    <linearGradient id="rvHeroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="rvHeroGlow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rvHeroName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="rvHeroLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rvHeroSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rvHeroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="rvHeroBlur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="rvHeroClip"><rect width="1200" height="380" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#rvHeroClip)">
    <rect width="1200" height="380" fill="url(#rvHeroBg)"/>
    <rect width="1200" height="380" fill="url(#rvHeroGlow)"/>
    <rect width="1200" height="380" fill="url(#rvHeroGrid)"/>

    <!-- moving light sweep -->
    <rect x="-400" y="0" width="400" height="380" fill="url(#rvHeroSweep)">
      <animate attributeName="x" from="-400" to="1200" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- circuit traces (static base) -->
    <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 70 H120 L150 40 H340 L360 60 H520"/>
      <path d="M0 320 H200 L230 350 H430"/>
      <path d="M1200 60 H1040 L1010 90 H860 L840 70 H760"/>
      <path d="M1200 330 H1000 L970 300 H820"/>
    </g>
    <g fill="#C77B9B" fill-opacity="0.6">
      <circle cx="520" cy="60" r="3.5"/><circle cx="430" cy="350" r="3.5"/>
      <circle cx="760" cy="70" r="3.5"/><circle cx="820" cy="300" r="3.5"/>
    </g>
    <!-- circuit traces (animated signal pulses) -->
    <g fill="none" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26 520">
      <path d="M0 70 H120 L150 40 H340 L360 60 H520">
        <animate attributeName="stroke-dashoffset" from="546" to="0" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 330 H1000 L970 300 H820">
        <animate attributeName="stroke-dashoffset" from="546" to="0" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M0 320 H200 L230 350 H430">
        <animate attributeName="stroke-dashoffset" from="546" to="0" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- RTL waveform: clock + data -->
    <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path stroke="#C77B9B" stroke-opacity="0.55" stroke-width="2"
            d="M640 330 H670 V300 H700 V330 H730 V300 H760 V330 H790 V300 H820"/>
      <path stroke="#E5B5C7" stroke-opacity="0.45" stroke-width="2"
            d="M840 330 V300 H900 V330 H960 V300 H1010 V330 H1090 V300 H1160"/>
    </g>
    <text x="640" y="352" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#C77B9B" fill-opacity="0.7">clk</text>
    <text x="840" y="352" font-family="'Courier New', Consolas, monospace" font-size="12" fill="#C77B9B" fill-opacity="0.7">data[3:0]</text>

    <!-- name -->
    <text x="80" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="1" fill="url(#rvHeroName)">Ruturaj Vyavahare</text>

    <!-- tagline -->
    <text x="82" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#E5B5C7">Aspiring VLSI <tspan fill="#C77B9B">|</tspan> RTL Design <tspan fill="#C77B9B">|</tspan> Design Verification Engineer</text>

    <!-- glowing underline -->
    <rect x="82" y="248" width="620" height="6" rx="3" fill="#C77B9B" opacity="0.55" filter="url(#rvHeroBlur)">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="82" y="248" width="620" height="3" rx="1.5" fill="url(#rvHeroLine)"/>

    <!-- context line -->
    <text x="82" y="290" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#C77B9B">B.E. E&amp;TC  ·  PVG's COETM, Pune  ·  Verilog  ·  FPGA  ·  SystemVerilog (learning)</text>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#701A3D" stroke-opacity="0.8" stroke-width="2"/>
</svg>
