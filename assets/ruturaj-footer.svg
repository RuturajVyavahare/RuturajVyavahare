<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="rvFootTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="rvFootTitle">Design. Verify. Innovate.</title>
  <defs>
    <linearGradient id="rvFootBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="rvFootLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rvFootClip"><rect width="1200" height="120" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#rvFootClip)">
    <rect width="1200" height="120" fill="url(#rvFootBg)"/>
    <rect x="300" y="26" width="600" height="2" fill="url(#rvFootLine)"/>
    <!-- waveform traces -->
    <g fill="none" stroke="#C77B9B" stroke-opacity="0.5" stroke-width="2" stroke-linecap="square">
      <path d="M0 90 H60 V70 H120 V90 H180 V70 H240 V90 H300"/>
      <path d="M900 90 H960 V70 H1020 V90 H1080 V70 H1140 V90 H1200"/>
    </g>
    <path d="M0 90 H60 V70 H120 V90 H180 V70 H240 V90 H300" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="24 276">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M900 90 H960 V70 H1020 V90 H1080 V70 H1140 V90 H1200" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="24 276">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#E5B5C7">Design. Verify. Innovate.</text>
  </g>
  <rect x="1" y="1" width="1198" height="118" rx="15" fill="none" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>
